<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- `viewport-fit=cover` is what makes env(safe-area-inset-*) report real
		     numbers on a notched iPhone; without it every inset is 0 and the
		     headers and sidebar slide under the notch and home indicator. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
		/>
		<!-- Inline, and here rather than in a stylesheet, because this has to be in
		     force before the first paint: a linked stylesheet arrives too late to
		     stop the white flash it exists to prevent. -->
		<style>
			html,
			body {
				background: #000;
			}

			/* Covers the app until it has something worth showing — the styles
			   parsed, the fonts and the background image decoded. Without it the
			   first frame is unstyled markup on white, then everything snaps into
			   place. Removed by the root layout, which also owns the fade. */
			#boot-cover {
				position: fixed;
				inset: 0;
				background: #000;
				z-index: 2147483647;
				pointer-events: none;
				opacity: 1;
				transition: opacity 200ms ease-out;
			}

			#boot-cover.hidden {
				opacity: 0;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="boot-cover"></div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
