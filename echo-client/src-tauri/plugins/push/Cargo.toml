[package]
name = "tauri-plugin-push"
version = "0.1.0"
description = "APNs registration for Echo: prompts, obtains the device token, and reports which APNs world it belongs to."
edition = "2021"
rust-version = "1.77.2"
# Required by tauri-plugin's build script: it keys the mobile asset registration
# on the crate's `links` name.
links = "tauri-plugin-push"

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
