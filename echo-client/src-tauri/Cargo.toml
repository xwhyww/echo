[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
# One artifact per platform: Android loads a `cdylib`, iOS links the
# `staticlib`, desktop uses the `rlib`.
#
# `cdylib` used to be dropped here, because a dynamic library has to resolve
# every symbol at its own link step and `init_plugin_screenshare` is deliberately
# not resolvable — the screenshare plugin's Swift is compiled by Xcode into the
# app target rather than by swift-rs into this build (see plugins/screenshare/
# build.rs). That undefined symbol is an iOS-only fact: it is declared under
# `cfg(target_os = "ios")`, and an Android build takes the `stub` half of both
# native plugins instead, where there is nothing left to resolve.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-screenshare = { path = "plugins/screenshare" }
tauri-plugin-push = { path = "plugins/push" }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-haptics = "2.3.2"
