[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
# `cdylib` is Android's artifact, and this project has no Android target — only
# gen/apple exists. It is dropped because a dynamic library has to resolve every
# symbol at its own link step, and `init_plugin_screenshare` is deliberately not
# resolvable there: the screenshare plugin's Swift is compiled by Xcode into the
# app target now, not by swift-rs into this build (see plugins/screenshare/
# build.rs). iOS links the staticlib, where an undefined symbol is expected and
# is resolved at Xcode's final link; desktop uses the rlib.
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-screenshare = { path = "plugins/screenshare" }
tauri-plugin-push = { path = "plugins/push" }
